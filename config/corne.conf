CONFIG_BT=y
CONFIG_ZMK_BLE=y
# Enable OLED Display (required for Corne screens)
CONFIG_ZMK_DISPLAY=y

# Power management / Deep sleep
# Enables deep sleep after inactivity to save battery
CONFIG_ZMK_SLEEP=y
# Milliseconds before entering deep sleep (1,800,000 ms = 30 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Boost Bluetooth signal power (helps prevent split-half desync)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable mouse keys (optional, comment out if not using pointing)
CONFIG_ZMK_MOUSE=y
CONFIG_WARN_AS_ERROR=n
